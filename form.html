<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>
</head>
<body style="background-color: rgb(83, 49, 1);">
    <h1 style="color: blanchedalmond;">Contact Me</h1>
    <p style="color: blanchedalmond;">This is a form that requires you to fill in your personal details in order to be able to contact and reach you at any specific time</p>
    <form action="" style="color: blanchedalmond;">
        <label for="Name">Full name</label><br>
        <input type="text" placeholder=" Enter your full name" required>
        <br><br>
        <label for="address">Full address</label><br>
        <input type="text" placeholder="Enter your full address" required>
        <br><br>
        <label for="phone number">Phone number</label><br>
        <input type="number" placeholder="080xxxxxxxx" required>
        <br><br>
        <label for="age">Age</label><br>
        <input type="number" placeholder="Enter your age" required>
        <br><br>
        <label for="class">Class</label><br>
        <input type="text" placeholder="Fill in your class">
        <br><br>
        <button type="submit">Register</button>
    </form>
    <br><br><br>
    <a href="index.html" style="color: blanchedalmond;">Go back to Home page</a>

</body>
</html>
